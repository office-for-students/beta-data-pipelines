# pre-prod-azure-pipelines.yml
trigger:
  - release/*

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: pipeline-preprod  # Library group containing pre-prod variables (e.g., PythonVersion)

extends:
  template: .azuredevops/azure-template.yml
  parameters:
    pythonVersion: '$(PythonVersion)' # Pulls from the variable group